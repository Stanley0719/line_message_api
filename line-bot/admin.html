<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#153a2b" />
    <title>餐廳訂位後台</title>
    <style>
      :root { font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; color: #20352b; background: #f2f6f2; font-synthesis: none; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 38px 20px; }
      main { width: min(1120px, 100%); margin: 0 auto; }
      header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
      h1 { margin: 0; font-size: clamp(26px, 5vw, 36px); letter-spacing: .02em; }
      .eyebrow { margin: 0 0 8px; color: #57816a; font-size: 13px; font-weight: 700; letter-spacing: .12em; }
      .controls { display: flex; gap: 10px; align-items: center; }
      input, button { min-height: 42px; border: 1px solid #d5e0d7; border-radius: 8px; padding: 8px 12px; background: #fff; color: inherit; font: inherit; }
      button { border-color: #1c7848; background: #1c7848; color: #fff; font-weight: 700; cursor: pointer; }
      button:hover { background: #145e37; }
      .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 18px; }
      .card, .table-wrap { border: 1px solid #e0e8e1; border-radius: 12px; background: #fff; box-shadow: 0 8px 24px #183d2808; }
      .card { padding: 20px 22px; }
      .card span { display: block; color: #6b796f; font-size: 14px; }
      .card strong { display: block; margin-top: 6px; font-size: 32px; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; text-align: left; }
      th, td { padding: 14px 16px; border-bottom: 1px solid #edf1ed; vertical-align: top; }
      th { background: #f8faf8; color: #59685e; font-size: 13px; white-space: nowrap; }
      tr:last-child td { border-bottom: 0; }
      .empty, .error { padding: 24px; text-align: center; color: #718076; }
      .error { color: #a13636; }
      @media (max-width: 640px) { body { padding: 24px 12px; } header { align-items: start; flex-direction: column; } .controls { width: 100%; } input { min-width: 0; flex: 1; } .stats { gap: 10px; } .card { padding: 16px; } th, td { padding: 12px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">RESTAURANT · RESERVATIONS</p>
          <h1>訂位管理</h1>
        </div>
        <form class="controls" id="filter">
          <label for="date">訂位日期</label>
          <input id="date" name="date" type="date" required />
          <button type="submit">查詢</button>
        </form>
      </header>
      <section class="stats" aria-live="polite">
        <article class="card"><span>當日訂位人數</span><strong id="total-people">—</strong></article>
        <article class="card"><span>當日訂位組數</span><strong id="reservation-count">—</strong></article>
      </section>
      <section class="table-wrap">
        <table>
          <thead>
            <tr><th>時間</th><th>訂位人</th><th>人數</th><th>聯絡方式</th><th>桌位</th><th>備註／特殊需求</th></tr>
          </thead>
          <tbody id="reservations"><tr><td class="empty" colspan="6">載入中…</td></tr></tbody>
        </table>
      </section>
    </main>
    <script>
      const dateInput = document.querySelector("#date");
      const rows = document.querySelector("#reservations");
      dateInput.value = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);

      function addCell(row, value) {
        const cell = document.createElement("td");
        cell.textContent = value || "—";
        row.append(cell);
      }

      async function loadReservations(event) {
        if (event) event.preventDefault();
        rows.replaceChildren();
        const loading = document.createElement("tr");
        const message = document.createElement("td");
        message.colSpan = 6;
        message.className = "empty";
        message.textContent = "載入中…";
        loading.append(message);
        rows.append(loading);
        try {
          const response = await fetch(`/api/reservations?date=${encodeURIComponent(dateInput.value)}`);
          if (!response.ok) throw new Error(response.status === 401 ? "登入驗證失敗，請重新整理並確認帳號密碼。" : `讀取失敗（HTTP ${response.status}）。`);
          const data = await response.json();
          document.querySelector("#total-people").textContent = data.total_people;
          document.querySelector("#reservation-count").textContent = data.reservation_count;
          rows.replaceChildren();
          if (data.reservations.length === 0) {
            const emptyRow = document.createElement("tr");
            const emptyCell = document.createElement("td");
            emptyCell.colSpan = 6;
            emptyCell.className = "empty";
            emptyCell.textContent = "此日期尚無訂位";
            emptyRow.append(emptyCell);
            rows.append(emptyRow);
            return;
          }
          for (const reservation of data.reservations) {
            const row = document.createElement("tr");
            addCell(row, reservation.reservation_time);
            addCell(row, reservation.customer_name);
            addCell(row, `${reservation.party_size} 人`);
            addCell(row, reservation.contact);
            addCell(row, reservation.assigned_tables);
            addCell(row, reservation.note === "無" ? "" : reservation.note);
            rows.append(row);
          }
        } catch (error) {
          rows.replaceChildren();
          const errorRow = document.createElement("tr");
          const errorCell = document.createElement("td");
          errorCell.colSpan = 6;
          errorCell.className = "error";
          errorCell.textContent = error.message;
          errorRow.append(errorCell);
          rows.append(errorRow);
        }
      }

      document.querySelector("#filter").addEventListener("submit", loadReservations);
      loadReservations();
    </script>
  </body>
</html>
